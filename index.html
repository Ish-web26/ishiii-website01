<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Website</title>

<!-- FIXED CSS PATH -->
<link rel="stylesheet" href="special/style.css">
</head>

<body>
    
<div class="container">

    <!-- PAGE 1 (ENVELOPE) -->
    <div class="card active" id="page1">
        <!-- FIXED IMAGE PATH -->
        <img src="special/envelope.jpg" class="cover-img" onclick="nextPage(2)">
        <p class="intro-text">Tap to open something special 💌</p>
    </div>

    <!-- PAGE 2 -->
    <div class="card" id="page2">
        <!-- FIXED IMAGE PATH -->
        <img src="special/SUKH.jpg" class="page2-img">
        <button onclick="nextPage(3)">Go to Letter 💙</button>
    </div>

    <!-- PAGE 3 -->
    <div class="card" id="page3">
        <div class="letter-box">
            <p id="typewriter"></p>
        </div>

        <button onclick="nextPage(1)">Restart</button>
    </div>

</div>
<script>
function nextPage(page) {
    let pages = document.querySelectorAll(".card");
    pages.forEach(p => p.classList.remove("active"));

    let currentPage = document.getElementById("page" + page);
    if (currentPage) {
        currentPage.classList.add("active");
    }

    if (page === 3) {
        let text = `Sukh,
I don’t know where to begin, because every time I try to put you into words... ❤️`;

        let i = 0;
        let el = document.getElementById("typewriter");
        el.innerHTML = "";

        function typeWriter() {
            if (i < text.length) {
                el.innerHTML += text.charAt(i);
                i++;
                setTimeout(typeWriter, 40);
            }
        }

        typeWriter();
    }
}
</script>

</body>
</html>
